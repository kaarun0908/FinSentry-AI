services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finsentry-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finsentry
      POSTGRES_PASSWORD: finsentry_secure_password
      POSTGRES_DB: finsentry_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
